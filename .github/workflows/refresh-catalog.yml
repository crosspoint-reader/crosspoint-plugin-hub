name: Refresh Plugin Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/build_catalog.py"
      - "tools/catalog_partitions.py"
      - "tools/build_extension_catalog.py"
      - "tests/**"
      - "plugin.js"
      - "device.json"
      - "manifest.json"
      - "whitelist.json"
      - "blacklist.json"
      - "PLUGIN_HUB_CONTRACT.md"
      - ".github/workflows/refresh-catalog.yml"

permissions:
  contents: write

concurrency:
  group: pluginhub-stable-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync current main
        shell: bash
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run catalog tests
        run: python -m unittest discover -s tests -v

      - name: Run browser plugin tests
        run: node --test tests/test_plugin_js.mjs

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_catalog.py

      - name: Build capability-gated theme and wallpaper catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_extension_catalog.py

      - name: Commit catalog and release-asset changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json catalog-lists.json "community-catalog*.json" community-themes.json community-wallpapers.json catalog-lists-capabilities.json duplicate-plugin-ids.json duplicate-extension-ids.json release-assets details
          if git diff --cached --quiet; then
            echo "Catalogs and release-asset mirror are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh plugin and extension catalogs"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep stable current after catalog refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/sync_stable.sh
