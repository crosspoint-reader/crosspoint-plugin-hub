name: Promote Stable Plugin Hub Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to promote (leave blank for latest)"
        required: false
        type: string

permissions:
  contents: write

# Refresh and promotion must not race when updating stable.
concurrency:
  group: pluginhub-stable-sync
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promote published release and synchronize stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: bash tools/sync_stable.sh "$REQUESTED_TAG"
