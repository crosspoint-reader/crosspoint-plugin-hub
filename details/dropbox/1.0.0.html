<h1>Dropbox</h1>
<p>Browse your Dropbox folders and download books and documents directly to your CrossPoint reader.</p>
<p>Files download to /books/Dropbox/ on the SD card. Supports EPUB, PDF, TXT, MOBI, and CBZ formats.</p>
<p>Requires a Dropbox account. Token configuration is stored on the SD card.</p>
